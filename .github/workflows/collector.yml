name: collector
# Continuous capture. A new run is always queued behind the active one (concurrency
# group, no cancel), so coverage is gapless without hitting the 6 h job limit.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
concurrency:
  group: collector
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BW_BASE_URLS: ${{ vars.BW_BASE_URLS }}
      BW_PROXY_URL: ${{ secrets.BW_PROXY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - name: Restore paper ledger
        run: mkdir -p data && gh release download ledger --pattern "*.sqlite" --dir data --clobber || true
      - name: Probe
        run: python -m vectiq probe
      - name: Collect (5h40m) and publish shards every 20 min
        run: |
          python -m vectiq collect --minutes 340 --out data &
          PID=$!
          while kill -0 $PID 2>/dev/null; do sleep 1200; python -m vectiq publish || true; done
          wait $PID || true
          python -m vectiq publish || true
      - name: Safety-net artifact
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: tape-${{ github.run_id }}, path: data/tape, retention-days: 7, if-no-files-found: ignore }
