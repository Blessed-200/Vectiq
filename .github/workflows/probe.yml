name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      BW_BASE_URLS: ${{ vars.BW_BASE_URLS }}
      BW_PROXY_URL: ${{ secrets.BW_PROXY_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - run: |
          { echo '```json'; python -m vectiq probe --line; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
