[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vectiq"
version = "0.1.0"
description = "Real-time odds capture, pricing and signal engine for table tennis"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "requests>=2.31", "zstandard>=0.22", "pyarrow>=15"]

[project.optional-dependencies]
dev = ["pytest>=8"]
report = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vectiq = ["signals/masters_seed.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
